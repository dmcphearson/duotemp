# The MET and aurora caching proxy at api.trough.dev (proxy/). Tests run on every pull request
# that touches it; merging to main deploys it to Cloudflare.
name: Proxy

on:
  pull_request:
    paths: ["proxy/**", ".github/workflows/proxy.yml"]
  push:
    branches: [main]
    paths: ["proxy/**", ".github/workflows/proxy.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.147.0
  SAFE_CHAIN_VERSION: 1.5.23
  SAFE_CHAIN_INSTALLER_SHA256: b7eac1c7152f300b229b865193d16424ad52386d1898c75ffaf374fcb4eeed3d

jobs:
  test:
    name: Proxy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Run tests
        working-directory: proxy
        run: node --test test/proxy.test.mjs

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # Wrangler comes from npm, so install it through safe-chain like every other npm package.
      - name: Install safe-chain
        run: |
          curl -fsSLo "$RUNNER_TEMP/install-safe-chain.sh" "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh"
          echo "${SAFE_CHAIN_INSTALLER_SHA256}  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: proxy
          command: deploy
