# CodeQL for the Swift app and the workflows. Swift analysis traces a full macOS build (about 17 minutes),
# so it runs on pushes to main and weekly, not on pull requests, and skips changes that only touch docs,
# licensing or images. It builds Debug for arm64 only: CodeQL reads the source as it compiles, so a second
# architecture or optimisation adds time without adding coverage. Pull requests still analyse the workflows.
name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'NOTICE'
      - 'LICENSE'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'NOTICE'
      - 'LICENSE'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  swift:
    name: Analyze (swift)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual

      - name: Select Xcode
        run: |
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project Duotemp.xcodeproj \
            -scheme Duotemp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:swift

  actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions
