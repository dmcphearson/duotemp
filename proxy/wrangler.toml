name = "duotemp-proxy"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
# Served only at api.trough.dev; no workers.dev address.
workers_dev = false
routes = [{ pattern = "api.trough.dev", custom_domain = true }]

[vars]
# App Attest: tokens are only issued to this app ("TEAMID.bundle ID").
APP_ID = "J479S78JUN.me.mcphearson.duotemp"
# "log" serves requests without a valid token and logs it; "enforce" refuses them.
ATTEST_MODE = "log"

# Counts of App Attest token status (valid, missing, invalid) and nothing else, for deciding when to enforce.
# Read with the SQL API; see CLAUDE.md.
[[analytics_engine_datasets]]
binding = "TOKEN_STATUS"
dataset = "duotemp_token_status"

# Workers Logs off: Cloudflare attaches each request's URL (coordinates) to every log line,
# and the privacy policy says the proxy keeps no logs. Console output shows only in a live `wrangler tail`.
[observability]
enabled = false
